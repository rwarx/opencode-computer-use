[project]
name = "opencode-computer-use"
version = "0.1.0"
description = "OpenCode Computer Use — local Codex-style visual desktop control for Windows (MCP stdio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "opencode", "computer-use", "windows-automation",
            "desktop-automation", "ui-automation", "ai-agents"]
authors = [{ name = "opencode-computer-use" }]
urls = { Homepage = "https://github.com/rwarx/opencode-computer-use" }
dependencies = [
  "mcp>=2.0",
  "mss>=9.0",
  "Pillow>=10.0",
]
authors = [{ name = "opencode-computer-use" }]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
uia = ["comtypes>=1.2", "pywinauto>=0.6"]
dev = ["pytest>=8.0"]
all = ["rapidocr-onnxruntime>=1.3", "comtypes>=1.2", "pywinauto>=0.6", "pytest>=8.0"]

[project.scripts]
opencode-computer-use = "opencode_computer_use.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
